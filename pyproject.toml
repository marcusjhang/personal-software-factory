[project]
name = "personal-software-factory"
version = "0.1.0"
description = "A repo-native, downloadable software factory: a foreman drives intake -> triage -> spec -> build -> verify -> review -> handoff with enforced gates and a durable ledger."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marcus Jhang" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
psf = "psf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
